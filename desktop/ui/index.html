<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Selena-port</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="rail__mark">
      <strong>Selena-port</strong>
      <span>Desktop console</span>
    </div>

    <nav class="rail__nav">
      <button class="rail__item is-active" data-view="console">Console</button>
      <button class="rail__item" data-view="gm">GM panel</button>
      <button class="rail__item" data-view="player">Player panel</button>
    </nav>

    <div class="rail__status" id="railStatus">
      <span class="dot" id="dotMongo"></span> mongodb
      <span class="dot" id="dotSdk"></span> server
      <span class="dot" id="dotGame"></span> game port
    </div>
  </aside>

  <main class="main">
    <section class="view is-active" data-view="console">
      <header class="view__head">
        <h1>Console</h1>
        <p>Start the stack, then open the panels or launch the patched client.</p>
      </header>

      <div class="rows" id="statusRows">
        <div class="row"><span>MongoDB</span><b id="rowMongo">checking…</b></div>
        <div class="row"><span>Server (SDK / game)</span><b id="rowSdk">checking…</b></div>
        <div class="row"><span>Game directory</span><b id="rowGameDir" class="dim">—</b></div>
      </div>

      <div class="actions">
        <button class="btn btn--primary" id="btnStart">Start stack</button>
        <button class="btn" id="btnStop">Stop</button>
        <button class="btn" id="btnLaunch">Launch client</button>
        <button class="btn btn--quiet" id="btnGm">Open GM</button>
        <button class="btn btn--quiet" id="btnPlayer">Open player</button>
      </div>

      <pre class="log" id="log"></pre>
    </section>

    <section class="view" data-view="gm">
      <iframe class="frame" id="frameGm" title="GM panel"></iframe>
    </section>

    <section class="view" data-view="player">
      <iframe class="frame" id="framePlayer" title="Player panel"></iframe>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
